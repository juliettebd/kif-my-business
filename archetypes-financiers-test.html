<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kif'My Business — Test des Archétypes Financiers®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --af-green:#95C11F;
    --af-blue:#11AAE3;
    --af-navy:#123859;
    --af-white:#FFFFFF;
    --af-mist:#F5F5F2;
    --af-line: rgba(18,56,89,0.14);
    --af-line-soft: rgba(18,56,89,0.08);
    --af-alert:#D64550;
    --af-gradient: linear-gradient(90deg, var(--af-green), var(--af-blue));
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--af-white);
    color:var(--af-navy);
    font-family:'Roboto', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.af-display{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }

  .af-app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HEADER ---------- */

  .af-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:22px 28px;
    border-bottom:1px solid var(--af-line-soft);
  }

  .af-brand{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1.05rem;
    color:var(--af-navy);
  }

  .af-brand span{
    background:var(--af-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .af-progress{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    max-width:340px;
  }

  .af-progress-track{
    position:relative;
    flex:1;
    height:4px;
    background:var(--af-line-soft);
    border-radius:2px;
    overflow:hidden;
  }

  .af-progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:var(--af-gradient);
    transition:width 0.35s ease;
  }

  .af-progress-count{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:var(--af-navy);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- MAIN LAYOUT ---------- */

  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:48px 24px 96px;
  }

  .af-screen{
    width:100%;
    max-width:620px;
  }

  /* ---------- CAPTURE SCREEN ---------- */

  .af-intro-eyebrow{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--af-blue);
    margin-bottom:14px;
  }

  .af-intro h1{
    font-size:2rem;
    line-height:1.15;
    margin-bottom:18px;
  }

  .af-intro p{
    font-size:1.02rem;
    line-height:1.65;
    color:rgba(18,56,89,0.82);
    margin:0 0 12px;
  }

  .af-intro-meta{
    display:flex;
    gap:20px;
    margin:26px 0 36px;
    padding:16px 0;
    border-top:1px solid var(--af-line-soft);
    border-bottom:1px solid var(--af-line-soft);
  }

  .af-meta-item{
    font-size:0.88rem;
    color:rgba(18,56,89,0.75);
  }

  .af-meta-item strong{
    display:block;
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1.15rem;
    color:var(--af-navy);
  }

  form.af-form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .af-field label{
    display:block;
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.85rem;
    margin-bottom:7px;
    color:var(--af-navy);
  }

  .af-field input[type="text"],
  .af-field input[type="email"]{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--af-line);
    border-radius:8px;
    font-family:'Roboto', Arial, sans-serif;
    font-size:1rem;
    color:var(--af-navy);
    background:var(--af-white);
    transition:border-color 0.2s ease;
  }

  .af-field input:focus{
    outline:none;
    border-color:var(--af-blue);
  }

  .af-field-error{
    display:none;
    font-size:0.8rem;
    color:var(--af-alert);
    margin-top:6px;
  }

  .af-field.af-invalid input{
    border-color:var(--af-alert);
  }

  .af-field.af-invalid .af-field-error{
    display:block;
  }

  .af-consent{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:16px;
    background:var(--af-mist);
    border-radius:8px;
    margin-top:6px;
  }

  .af-consent input{
    margin-top:3px;
    width:17px;
    height:17px;
    accent-color:var(--af-blue);
    flex-shrink:0;
  }

  .af-consent label{
    font-size:0.88rem;
    line-height:1.5;
    color:rgba(18,56,89,0.85);
  }

  /* ---------- BUTTONS ---------- */

  .af-btn{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    border:none;
    border-radius:8px;
    padding:15px 30px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    display:inline-block;
    text-decoration:none;
    text-align:center;
  }

  .af-btn-primary{
    background:var(--af-gradient);
    color:var(--af-white);
  }

  .af-btn-primary:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(17,170,227,0.28);
  }

  .af-btn-primary:disabled{
    opacity:0.38;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  .af-btn-secondary{
    background:transparent;
    color:var(--af-navy);
    border:1px solid var(--af-line);
  }

  .af-btn-secondary:hover{
    border-color:var(--af-navy);
  }

  .af-form-submit{
    margin-top:8px;
  }

  /* ---------- QUIZ SCREEN ---------- */

  .af-quiz-head{
    margin-bottom:8px;
  }

  .af-quiz-head h2{
    font-size:1.3rem;
    margin-bottom:6px;
  }

  .af-quiz-head p{
    font-size:0.92rem;
    color:rgba(18,56,89,0.68);
    margin:0;
  }

  .af-error-banner{
    display:none;
    align-items:center;
    gap:10px;
    background:rgba(214,69,80,0.08);
    border:1px solid rgba(214,69,80,0.3);
    color:var(--af-alert);
    border-radius:8px;
    padding:13px 16px;
    font-size:0.88rem;
    margin:18px 0;
  }

  .af-error-banner.show{ display:flex; }

  .af-question{
    padding:26px 0;
    border-bottom:1px solid var(--af-line-soft);
  }

  .af-question:first-of-type{
    border-top:1px solid var(--af-line-soft);
  }

  .af-question-text{
    font-size:1.02rem;
    line-height:1.55;
    color:var(--af-navy);
    margin-bottom:16px;
  }

  .af-likert{
    display:flex;
    gap:8px;
  }

  .af-likert button{
    flex:1;
    min-height:64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border:1px solid var(--af-line);
    background:var(--af-white);
    border-radius:7px;
    padding:8px 4px;
    cursor:pointer;
    transition:all 0.15s ease;
  }

  .af-likert-num{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1rem;
    color:rgba(18,56,89,0.55);
  }

  .af-likert-label{
    font-family:'Roboto', Arial, sans-serif;
    font-weight:400;
    font-size:0.72rem;
    line-height:1.2;
    text-align:center;
    color:rgba(18,56,89,0.55);
  }

  .af-likert button:hover{
    border-color:var(--af-blue);
  }

  .af-likert button:hover .af-likert-num,
  .af-likert button:hover .af-likert-label{
    color:var(--af-blue);
  }

  .af-likert button.selected{
    background:var(--af-gradient);
    border-color:transparent;
  }

  .af-likert button.selected .af-likert-num,
  .af-likert button.selected .af-likert-label{
    color:var(--af-white);
  }

  @media (max-width: 560px){
    .af-likert{ flex-direction:column; gap:8px; }
    .af-likert button{ flex-direction:row; justify-content:flex-start; min-height:48px; padding:10px 14px; gap:12px; }
    .af-likert-label{ text-align:left; font-size:0.85rem; }
  }

  .af-quiz-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:32px;
  }

  .af-quiz-nav-spacer{ flex:1; }

  /* ---------- RESULTS SCREEN ---------- */

  .af-results h1{
    font-size:1.7rem;
    margin-bottom:12px;
  }

  .af-results-intro{
    font-size:1.02rem;
    line-height:1.6;
    color:rgba(18,56,89,0.82);
    margin:0 0 30px;
  }

  .af-results-intro strong{
    color:var(--af-navy);
  }

  .af-send-status{
    margin-top:10px;
    margin-bottom:30px;
    font-size:0.85rem;
    line-height:1.5;
  }

  .af-send-status-pending{ color:rgba(18,56,89,0.55); }
  .af-send-status-success{ color:rgba(18,56,89,0.55); }
  .af-send-status-error{ color:var(--af-alert); }
  .af-send-status-info{ color:rgba(18,56,89,0.55); }

  /* ---------- VIDÉO ARCHÉTYPE PRINCIPAL ---------- */

  .af-featured{
    margin-bottom:44px;
  }

  .af-featured-label{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--af-blue);
    margin-bottom:12px;
  }

  .af-video-link{
    display:block;
    position:relative;
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    background:var(--af-navy);
    line-height:0;
  }

  .af-video-thumb{
    width:100%;
    display:block;
    aspect-ratio:16/9;
    object-fit:cover;
    opacity:0.92;
    transition:opacity 0.15s ease;
  }

  .af-video-link:hover .af-video-thumb{
    opacity:1;
  }

  .af-video-play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(18,56,89,0.78);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease, background 0.15s ease;
  }

  .af-video-link:hover .af-video-play{
    transform:translate(-50%,-50%) scale(1.06);
    background:var(--af-navy);
  }

  .af-featured-footer{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-top:14px;
  }

  .af-featured-name{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:1.35rem;
    color:var(--af-navy);
  }

  .af-featured-score{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    color:rgba(18,56,89,0.6);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  /* ---------- AUTRES ARCHÉTYPES ---------- */

  .af-others-label{
    font-size:0.92rem;
    color:rgba(18,56,89,0.68);
    margin-bottom:10px;
  }

  .af-others-list{
    display:flex;
    flex-direction:column;
  }

  .af-others-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 4px;
    border-bottom:1px solid var(--af-line-soft);
  }

  .af-others-item:first-child{
    border-top:1px solid var(--af-line-soft);
  }

  .af-others-rank{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:800;
    font-size:0.8rem;
    color:rgba(18,56,89,0.38);
    width:22px;
    flex-shrink:0;
  }

  .af-others-thumb-link{
    position:relative;
    display:block;
    flex-shrink:0;
    width:64px;
    height:36px;
    border-radius:5px;
    overflow:hidden;
    text-decoration:none;
    background:var(--af-navy);
  }

  .af-others-thumb{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    opacity:0.9;
    transition:opacity 0.15s ease;
  }

  .af-others-thumb-link:hover .af-others-thumb{
    opacity:1;
  }

  .af-others-thumb-play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    background:rgba(18,56,89,0.78);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .af-others-name{
    flex:1;
    font-size:0.92rem;
    color:var(--af-navy);
    font-weight:500;
  }

  .af-others-score{
    font-family:'Mulish', Arial, sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:rgba(18,56,89,0.65);
    font-variant-numeric:tabular-nums;
  }

  @media (max-width: 560px){
    .af-header{ padding:16px 18px; flex-wrap:wrap; }
    .af-progress{ order:3; max-width:none; width:100%; }
    main{ padding:32px 16px 80px; }
    .af-intro h1{ font-size:1.6rem; }
  }
</style>
</head>

    { id:53, cat:"Connectrice", text:"Je ne ressens pas une forte connexion avec l'argent." },
    { id:54, cat:"Accumulatrice", text:"Je me sens protégée et en sécurité quand j'épargne beaucoup d'argent." },
    { id:55, cat:"Connectrice", text:"À l'extrême, je me sens dépassée voire démunie vis-à-vis de l'argent et j'aimerais que le besoin d'argent disparaisse." },
    { id:56, cat:"Accumulatrice", text:"Je ressens une forte connexion émotionnelle avec l'argent." },
    { id:57, cat:"Romantique", text:"Je souhaite vivre ma vie de rêve, peu importe le coût qu'elle peut avoir." },
    { id:58, cat:"Dirigeante", text:"À l'extrême, je ne suis jamais satisfaite de l'argent que je possède et je m'efforce d'en gagner toujours plus." },
    { id:59, cat:"Romantique", text:"L'argent doit être dépensé ici et maintenant puisqu'il ne peut être emporté dans l'au-delà." },
    { id:60, cat:"Dirigeante", text:"Je n'hésite pas à prendre des décisions en matière d'argent et de gestion financière." },
    { id:61, cat:"Romantique", text:"Mes achats me permettent de me sentir bien dans ma peau." },
    { id:62, cat:"Dirigeante", text:"Je crois que je serai plus heureuse quand j'aurai plus d'argent (même si j'en ai déjà plus qu'auparavant)." },
    { id:63, cat:"Romantique", text:"À l'extrême, je dépense mon argent de manière impulsive." },
    { id:64, cat:"Dirigeante", text:"J'ai peur de perdre le contrôle ou mon pouvoir sur mon argent." }
  ];

  var LIKERT_OPTIONS = [1, 2, 3, 4, 5];
  var LIKERT_LABELS = {
    1: "Pas du tout d'accord",
    2: "Pas d'accord",
    3: "Neutre",
    4: "D'accord",
    5: "Tout à fait d'accord"
  };

  var ARCHETYPE_VIDEOS = {
    "Accumulatrice": "UGmxNq2SAss",
    "Alchimiste": "jtbC3xnNavU",
    "Célébrité": "MfFC4qP-nrs",
    "Connectrice": "d3LtUgU0E-I",
    "Dirigeante": "RaezyZL9kUc",
    "Nourricière": "jWKGyx0pHXc",
    "Rebelle": "qD6DlVBbpGg",
    "Romantique": "5wF5HqbTitA"
  };

  var state = {
    screen: "capture",
    page: 0,
    answers: {},
    participant: { prenom:"", email:"", pays:"" },
    order: shuffle(QUESTIONS.slice()),
    results: null,
    submitting: false,
    debugMode: false
  };

  var pages = chunk(state.order, QUESTIONS_PER_PAGE);
  var totalPages = pages.length;

  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("debug") === "results"){
    state.debugMode = true;
    state.participant = { prenom: "Prénom Test", email: "debug@chenillepapillon.be", pays: "Belgique" };
    state.results = {
      scores: {
        "Accumulatrice": 30, "Alchimiste": 24, "Célébrité": 18, "Connectrice": 20,
        "Dirigeante": 34, "Nourricière": 28, "Rebelle": 22, "Romantique": 26
      },
      ranking: [
        { name: "Dirigeante", score: 34 },
        { name: "Accumulatrice", score: 30 },
        { name: "Nourricière", score: 28 },
        { name: "Romantique", score: 26 },
        { name: "Alchimiste", score: 24 },
        { name: "Rebelle", score: 22 },
        { name: "Connectrice", score: 20 },
        { name: "Célébrité", score: 18 }
      ],
      principal: { name: "Dirigeante", score: 34 }
    };
    state.screen = "results";
  }

  function scrollToTopEverywhere(){
    window.scrollTo({ top: 0, behavior: "smooth" });
    try {
      window.parent.postMessage({ source: "archetypes-financiers", type: "scrollTop" }, "*");
    } catch (e) { /* pas d'iframe parente, ou origine bloquée : sans effet */ }
  }

  function notifyParentResize(){
    try {
      window.parent.postMessage({
        source: "archetypes-financiers",
        type: "resize",
        height: document.documentElement.scrollHeight
      }, "*");
    } catch (e) { /* pas d'iframe parente : sans effet */ }
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function chunk(arr, size){
    var out = [];
    for (var i = 0; i < arr.length; i += size){
      out.push(arr.slice(i, i + size));
    }
    return out;
  }

  function answeredCount(){
    return Object.keys(state.answers).length;
  }

  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs){
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function(child){
      if (child) node.appendChild(child);
    });
    return node;
  }

  function updateProgressBar(){
    var progressWrap = document.getElementById("af-progress");
    var fill = document.getElementById("af-progress-fill");
    var count = document.getElementById("af-progress-count");

    if (state.screen !== "quiz"){
      progressWrap.hidden = true;
      return;
    }
    progressWrap.hidden = false;
    var answered = answeredCount();
    var pct = (answered / QUESTIONS.length) * 100;
    fill.style.width = pct + "%";
    count.textContent = answered + " / " + QUESTIONS.length + " réponses";
  }

  function renderCapture(){
    var main = document.getElementById("af-main");
    main.innerHTML = "";

    var screen = el("div", { class: "af-screen af-intro" });

    screen.appendChild(el("div", { class: "af-intro-eyebrow" }, [document.createTextNode("Test gratuit — 15 à 20 minutes")]));
    screen.appendChild(el("h1", {}, [document.createTextNode("Découvrez votre Archétype Financier principal")]));

    var p1 = el("p", {}, [document.createTextNode("Il n'y a ni bonne ni mauvaise réponse. Répondez spontanément, en fonction de ce que vous ressentez le plus souvent dans votre relation à l'argent.")]);
    var p2 = el("p", {}, [document.createTextNode("Vos résultats vous seront envoyés par email, avec une vidéo pour mieux comprendre votre archétype principal.")]);
    screen.appendChild(p1);
    screen.appendChild(p2);

    var meta = el("div", { class: "af-intro-meta" }, [
      el("div", { class: "af-meta-item" }, [el("strong", {}, [document.createTextNode("64")]), document.createTextNode("affirmations")]),
      el("div", { class: "af-meta-item" }, [el("strong", {}, [document.createTextNode("8")]), document.createTextNode("Archétypes Financiers")]),
      el("div", { class: "af-meta-item" }, [el("strong", {}, [document.createTextNode("15-20")]), document.createTextNode("minutes")])
    ]);
    screen.appendChild(meta);

    var form = el("form", { class: "af-form" });

    var fPrenom = buildField("text", "prenom", "Prénom", "Votre prénom");
    var fEmail = buildField("email", "email", "Email", "vous@exemple.com");
    var fPays = buildField("text", "pays", "Pays", "Votre pays");

    form.appendChild(fPrenom.wrap);
    form.appendChild(fEmail.wrap);
    form.appendChild(fPays.wrap);

    var consentWrap = el("div", { class: "af-consent" });
    var consentInput = el("input", { type: "checkbox", id: "af-consent-input" });
    var consentLabel = el("label", { for: "af-consent-input" }, [
      document.createTextNode("J'accepte de recevoir des emails de Chenille Papillon, dont les résultats de ce test.")
    ]);
    consentWrap.appendChild(consentInput);
    consentWrap.appendChild(consentLabel);
    form.appendChild(consentWrap);

    var submitBtn = el("button", { type: "submit", class: "af-btn af-btn-primary af-form-submit" }, [document.createTextNode("Commencer le test →")]);
    form.appendChild(submitBtn);

    form.addEventListener("submit", function(e){
      e.preventDefault();

      var prenomVal = fPrenom.input.value.trim();
      var emailVal = fEmail.input.value.trim();
      var paysVal = fPays.input.value.trim();
      var consentVal = consentInput.checked;

      var valid = true;

      if (prenomVal.length < 2){ setInvalid(fPrenom, "Merci d'indiquer votre prénom."); valid = false; }
      else setValid(fPrenom);

      if (!isValidEmail(emailVal)){ setInvalid(fEmail, "Cet email ne semble pas valide."); valid = false; }
      else setValid(fEmail);

      if (paysVal.length < 2){ setInvalid(fPays, "Merci d'indiquer votre pays."); valid = false; }
      else setValid(fPays);

      if (!consentVal){
        valid = false;
        consentWrap.style.outline = "1px solid #D64550";
      } else {
        consentWrap.style.outline = "none";
      }

      if (!valid) return;

      state.participant = { prenom: prenomVal, email: emailVal, pays: paysVal, consent: true };
      state.screen = "quiz";
      state.page = 0;
      render();
      scrollToTopEverywhere();
    });

    screen.appendChild(form);
    main.appendChild(screen);
  }

  function buildField(type, name, labelText, placeholder){
    var wrap = el("div", { class: "af-field" });
    var label = el("label", { for: "af-field-" + name }, [document.createTextNode(labelText)]);
    var input = el("input", { type: type, id: "af-field-" + name, name: name, placeholder: placeholder, autocomplete: (type === "email" ? "email" : "off") });
    var error = el("div", { class: "af-field-error" }, [document.createTextNode("")]);
    wrap.appendChild(label);
    wrap.appendChild(input);
    wrap.appendChild(error);
    return { wrap: wrap, input: input, error: error };
  }

  function setInvalid(field, message){
    field.wrap.classList.add("af-invalid");
    field.error.textContent = message;
  }

  function setValid(field){
    field.wrap.classList.remove("af-invalid");
    field.error.textContent = "";
  }

  function renderQuiz(){
    var main = document.getElementById("af-main");
    main.innerHTML = "";

    var screen = el("div", { class: "af-screen" });

    var head = el("div", { class: "af-quiz-head" }, [
      el("h2", {}, [document.createTextNode("Vos affirmations")]),
      el("p", {}, [document.createTextNode("Cochez la réponse qui correspond le plus à ce que vous ressentez, sans trop réfléchir.")])
    ]);
    screen.appendChild(head);

    var errorBanner = el("div", { class: "af-error-banner", id: "af-error-banner" }, [
      document.createTextNode("Merci de répondre aux " + QUESTIONS_PER_PAGE + " affirmations de cette page avant de continuer.")
    ]);
    screen.appendChild(errorBanner);

    var currentPageQuestions = pages[state.page];

    currentPageQuestions.forEach(function(question){
      var qBlock = el("div", { class: "af-question" });
      qBlock.appendChild(el("div", { class: "af-question-text" }, [document.createTextNode(question.text)]));

      var likert = el("div", { class: "af-likert" });
      LIKERT_OPTIONS.forEach(function(value){
        var btn = el("button", { type: "button" }, [
          el("span", { class: "af-likert-num" }, [document.createTextNode(String(value))]),
          el("span", { class: "af-likert-label" }, [document.createTextNode(LIKERT_LABELS[value])])
        ]);
        if (state.answers[question.id] === value) btn.classList.add("selected");
        btn.addEventListener("click", function(){
          state.answers[question.id] = value;
          document.getElementById("af-error-banner").classList.remove("show");
          renderQuiz();
          updateProgressBar();
        });
        likert.appendChild(btn);
      });

      qBlock.appendChild(likert);
      screen.appendChild(qBlock);
    });

    var nav = el("div", { class: "af-quiz-nav" });

    if (state.page > 0){
      var backBtn = el("button", { type: "button", class: "af-btn af-btn-secondary" }, [document.createTextNode("← Précédent")]);
      backBtn.addEventListener("click", function(){
        state.page -= 1;
        render();
        scrollToTopEverywhere();
      });
      nav.appendChild(backBtn);
    } else {
      nav.appendChild(el("div", {}, []));
    }

    nav.appendChild(el("div", { class: "af-quiz-nav-spacer" }));

    var isLastPage = state.page === totalPages - 1;
    var nextBtn = el("button", { type: "button", class: "af-btn af-btn-primary" }, [
      document.createTextNode(isLastPage ? "Voir mes résultats →" : "Page suivante →")
    ]);
    nextBtn.addEventListener("click", function(){
      var pageComplete = currentPageQuestions.every(function(q){ return state.answers[q.id] !== undefined; });
      if (!pageComplete){
        document.getElementById("af-error-banner").classList.add("show");
        scrollToTopEverywhere();
        return;
      }

      if (isLastPage){
        var allComplete = state.order.every(function(q){ return state.answers[q.id] !== undefined; });
        if (!allComplete){
          document.getElementById("af-error-banner").classList.add("show");
          scrollToTopEverywhere();
          return;
        }
        submitTest();
      } else {
        state.page += 1;
        render();
        scrollToTopEverywhere();
      }
    });
    nav.appendChild(nextBtn);

    screen.appendChild(nav);
    main.appendChild(screen);
  }

  function computeResults(){
    var scores = {
      "Accumulatrice": 0, "Alchimiste": 0, "Célébrité": 0, "Connectrice": 0,
      "Dirigeante": 0, "Nourricière": 0, "Rebelle": 0, "Romantique": 0
    };

    QUESTIONS.forEach(function(q){
      var answer = state.answers[q.id];
      scores[q.cat] += answer;
    });

    var ranking = Object.keys(scores)
      .map(function(name){ return { name: name, score: scores[name] }; })
      .sort(function(a, b){
        if (b.score !== a.score) return b.score - a.score;
        return a.name.localeCompare(b.name);
      });

    return {
      scores: scores,
      ranking: ranking,
      principal: ranking[0]
    };
  }

  function submitTest(){
    if (state.submitting) return;
    state.submitting = true;

    var results = computeResults();
    state.results = results;

    // MODIFICATION 1 : on passe à l'écran résultats et on laisse
    // renderResults() déclencher le scroll après construction du DOM.
    state.screen = "results";
    render();
    sendResultsToBackend(results);
  }

  function sendResultsToBackend(results){
    var payload = {
      testVersion: TEST_VERSION,
      participant: state.participant,
      scores: results.scores,
      ranking: results.ranking,
      principal: results.principal
    };

    if (!APPS_SCRIPT_URL){
      console.log("[Archétypes Financiers] APPS_SCRIPT_URL non configurée. Payload calculé :", payload);
      state.submitting = false;
      setSendStatus("info", "Apps Script non connecté pour l'instant : résultats journalisés dans la console.");
      return;
    }

    setSendStatus("pending", "Envoi de vos résultats par email en cours…");

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(function(response){
        if (!response.ok) throw new Error("Réponse serveur non OK");
        return response.json();
      })
      .then(function(data){
        state.submitting = false;
        if (data && data.ok === false) throw new Error(data.error || "Erreur serveur");
        setSendStatus("success", "Vos résultats vous ont aussi été envoyés par email.");
      })
      .catch(function(err){
        console.error("[Archétypes Financiers] Échec de l'envoi :", err);
        state.submitting = false;
        setSendStatus("error", "L'envoi automatique a rencontré un problème, mais vos résultats restent affichés ci-dessus.");
      });
  }

  function setSendStatus(type, text){
    var statusEl = document.getElementById("af-send-status");
    if (!statusEl) return;
    statusEl.className = "af-send-status af-send-status-" + type;
    statusEl.textContent = text;
  }

  function renderResults(){
    var main = document.getElementById("af-main");
    main.innerHTML = "";

    var results = state.results;
    var screen = el("div", { class: "af-screen af-results" });

    screen.appendChild(el("div", { class: "af-intro-eyebrow" }, [document.createTextNode("Vos résultats")]));
    screen.appendChild(el("h1", {}, [document.createTextNode("Merci, " + state.participant.prenom + " !")]));
    screen.appendChild(el("p", { class: "af-results-intro" }, [
      document.createTextNode("Votre Archétype Financier principal est "),
      el("strong", {}, [document.createTextNode(results.principal.name)]),
      document.createTextNode(".")
    ]));

    var statusEl = state.debugMode
      ? el("div", { class: "af-send-status af-send-status-info", id: "af-send-status" }, [
          document.createTextNode("Mode debug : données fictives, aucun envoi n'a été effectué.")
        ])
      : el("div", { class: "af-send-status af-send-status-pending", id: "af-send-status" }, [
          document.createTextNode("Envoi de vos résultats par email en cours…")
        ]);
    screen.appendChild(statusEl);

    var featured = el("div", { class: "af-featured" });
    featured.appendChild(el("div", { class: "af-featured-label" }, [document.createTextNode("Votre archétype principal")]));

    var videoId = ARCHETYPE_VIDEOS[results.principal.name];
    if (videoId){
      var thumbUrl = "https://img.youtube.com/vi/" + videoId + "/hqdefault.jpg";
      var videoLink = el("a", { class: "af-video-link", href: "https://youtu.be/" + videoId, target: "_blank", rel: "noopener" });
      var thumbImg = el("img", { class: "af-video-thumb", src: thumbUrl, alt: "Découvrir l'archétype " + results.principal.name });
      var playBtn = el("span", { class: "af-video-play", html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7L8 5z" fill="#FFFFFF"/></svg>' });
      videoLink.appendChild(thumbImg);
      videoLink.appendChild(playBtn);
      featured.appendChild(videoLink);
    }

    featured.appendChild(el("div", { class: "af-featured-footer" }, [
      el("span", { class: "af-featured-name" }, [document.createTextNode(results.principal.name)]),
      el("span", { class: "af-featured-score" }, [document.createTextNode(results.principal.score + " points")])
    ]));

    screen.appendChild(featured);

    var othersWrap = el("div", { class: "af-others" });
    othersWrap.appendChild(el("div", { class: "af-others-label" }, [document.createTextNode("Les autres archétypes, du plus au moins présent chez vous")]));

    var list = el("div", { class: "af-others-list" });
    results.ranking.slice(1).forEach(function(item, index){
      var itemChildren = [
        el("span", { class: "af-others-rank" }, [document.createTextNode("#" + (index + 2))])
      ];

      var otherVideoId = ARCHETYPE_VIDEOS[item.name];
      if (otherVideoId){
        var otherThumbUrl = "https://img.youtube.com/vi/" + otherVideoId + "/hqdefault.jpg";
        var otherLink = el("a", {
          class: "af-others-thumb-link",
          href: "https://youtu.be/" + otherVideoId,
          target: "_blank",
          rel: "noopener"
        });
        otherLink.appendChild(el("img", { class: "af-others-thumb", src: otherThumbUrl, alt: "Découvrir l'archétype " + item.name }));
        otherLink.appendChild(el("span", { class: "af-others-thumb-play", html: '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7L8 5z" fill="#FFFFFF"/></svg>' }));
        itemChildren.push(otherLink);
      }

      itemChildren.push(el("span", { class: "af-others-name" }, [document.createTextNode(item.name)]));
      itemChildren.push(el("span", { class: "af-others-score" }, [document.createTextNode(String(item.score))]));

      list.appendChild(el("div", { class: "af-others-item" }, itemChildren));
    });
    othersWrap.appendChild(list);
    screen.appendChild(othersWrap);

    main.appendChild(screen);

    // MODIFICATION 2 : scroll après construction complète du DOM
    setTimeout(function(){ scrollToTopEverywhere(); }, 50);
  }

  function render(){
    updateProgressBar();
    if (state.screen === "capture") renderCapture();
    else if (state.screen === "quiz") renderQuiz();
    else if (state.screen === "results") renderResults();

    notifyParentResize();
    setTimeout(notifyParentResize, 200);
  }

  window.addEventListener("resize", notifyParentResize);

  render();

})();
</script>
